name: Setup Windows Qt build environment
description: Qt 6.8.2 desktop kit for PixelStudio CI

inputs:
  qt-version:
    description: Qt version (aqtinstall)
    required: false
    default: "6.8.2"
  install-ninja:
    description: Install Ninja tool (for build-installer.ps1 / Ninja generator)
    required: false
    default: "false"
  modules:
    description: Extra Qt modules for aqtinstall (space-separated)
    required: false
    default: "qt5compat qtsvg"

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true
        cache-key-prefix: pixelstudio-qt-${{ inputs.qt-version }}
        modules: ${{ inputs.modules }}
        tools: ${{ inputs.install-ninja == 'true' && 'tools_ninja' || '' }}

    - name: Verify Qt
      shell: pwsh
      run: |
        if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR is not set" }
        if (-not (Test-Path "$env:QT_ROOT_DIR\bin\qmake.exe")) {
          throw "Qt not found under QT_ROOT_DIR=$env:QT_ROOT_DIR"
        }
        cmake --version
        & "$env:QT_ROOT_DIR\bin\qmake.exe" -query QT_VERSION
