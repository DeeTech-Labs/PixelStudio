name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0 or v1.2.3b"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $t = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($t -notmatch '^v\d+(\.\d+){2}([a-zA-Z])?$') {
            throw "Invalid tag: $t (expected vMajor.Minor.Patch or vMajor.Minor.Patchfix, e.g. v1.2.3b)"
          }
          "name=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify tag matches cmake version
        shell: pwsh
        run: |
          . ./cmake/ReadPixelStudioVersion.ps1
          Test-PixelStudioReleaseTag -Tag '${{ steps.tag.outputs.name }}' -RepoRoot $PWD

      - name: Setup build environment
        uses: ./.github/actions/setup-windows-qt
        with:
          install-ninja: "true"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$isccDir\ISCC.exe")) { throw "ISCC.exe not found after install" }
          echo "$isccDir" >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          $buildDir = Join-Path $PWD "build\Release"
          & "$PWD\installer\windows-build-installer.ps1" -QtDir $env:QT_ROOT_DIR -BuildDir $buildDir

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: installer/output/PixelStudio-Setup-*.exe
          if-no-files-found: error

  release-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            t="${{ inputs.tag }}"
          else
            t="${{ github.ref_name }}"
          fi
          if [[ ! "$t" =~ ^v[0-9]+(\.[0-9]+){2}([a-zA-Z])?$ ]]; then
            echo "Invalid tag: $t (expected vMajor.Minor.Patch or vMajor.Minor.Patchfix, e.g. v1.2.3b)" >&2
            exit 1
          fi
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches cmake version
        shell: bash
        run: |
          set -euo pipefail
          source ./cmake/read-pixel-studio-version.sh
          test_pixel_studio_release_tag '${{ steps.tag.outputs.name }}' "$PWD"

      - name: Setup build environment
        uses: ./.github/actions/setup-macos-qt

      - name: Build macOS bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          export QT_DIR="$QT_ROOT_DIR"
          chmod +x installer/macos-*.sh cmake/read-pixel-studio-version.sh
          installer/macos-build-bundle.sh
          installer/macos-make-dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: installer/output/PixelStudio_*_macos_universal.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            t="${{ inputs.tag }}"
          else
            t="${{ github.ref_name }}"
          fi
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      - name: Prepare release assets and notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          win_assets=(release-artifacts/release-windows/PixelStudio-Setup-*.exe)
          mac_assets=(release-artifacts/release-macos/PixelStudio_*_macos_universal.dmg)
          if [[ ${#win_assets[@]} -eq 0 ]]; then
            echo "Windows installer not found" >&2
            exit 1
          fi
          if [[ ${#mac_assets[@]} -eq 0 ]]; then
            echo "macOS DMG not found" >&2
            exit 1
          fi
          win_file="${win_assets[0]}"
          mac_file="${mac_assets[0]}"
          win_name="$(basename "$win_file")"
          mac_name="$(basename "$mac_file")"
          win_hash="$(sha256sum "$win_file" | awk '{print $1}')"
          mac_hash="$(sha256sum "$mac_file" | awk '{print $1}')"
          mkdir -p release-upload
          cp "$win_file" "release-upload/$win_name"
          cp "$mac_file" "release-upload/$mac_name"
          cat > release-notes-extra.md <<EOF
## Checksums

| File | SHA256 |
|------|--------|
| $win_name | \`$win_hash\` |
| $mac_name | \`$mac_hash\` |

Built from tag \`${{ steps.tag.outputs.name }}\` on Windows x64 (Qt 6.8.2, MSVC 2022) and macOS universal (Qt 6.8.2, clang).
EOF
          {
            echo "win_name=$win_name"
            echo "mac_name=$mac_name"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PixelStudio ${{ steps.tag.outputs.name }}
          files: |
            release-upload/${{ steps.meta.outputs.win_name }}
            release-upload/${{ steps.meta.outputs.mac_name }}
          body_path: release-notes-extra.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
