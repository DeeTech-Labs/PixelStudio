name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0 or v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build installer and publish release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $t = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($t -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Invalid tag: $t (expected SemVer vX.Y.Z or vX.Y.Z-prerelease, e.g. v1.2.3 or v1.2.3-rc.1)"
          }
          "name=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify tag matches cmake version
        shell: pwsh
        run: |
          . ./cmake/ReadPixelStudioVersion.ps1
          Test-PixelStudioReleaseTag -Tag '${{ steps.tag.outputs.name }}' -RepoRoot $PWD

      - name: Setup build environment
        uses: ./.github/actions/setup-windows-qt
        with:
          install-ninja: "true"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$isccDir\ISCC.exe")) { throw "ISCC.exe not found after install" }
          echo "$isccDir" >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          $buildDir = Join-Path $PWD "build\Release"
          & "$PWD\installer\build-installer.ps1" -QtDir $env:QT_ROOT_DIR -BuildDir $buildDir

      - name: Write release notes
        id: meta
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/output -Filter "PixelStudio-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Installer not found in installer/output" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          # Relative path with forward slashes — absolute D:\a\... paths break GITHUB_OUTPUT (\a escape).
          $assetPath = "installer/output/$($setup.Name)"
          @(
            "## Checksums",
            "",
            "| File | SHA256 |",
            "|------|--------|",
            "| $($setup.Name) | ``$hash`` |",
            "",
            "Built from tag ``${{ steps.tag.outputs.name }}`` on Windows x64 (Qt 6.8.2, MSVC 2022)."
          ) | Set-Content -Path release-notes-extra.md -Encoding utf8NoBOM
          "path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PixelStudio ${{ steps.tag.outputs.name }}
          files: ${{ steps.meta.outputs.path }}
          body_path: release-notes-extra.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
