name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - "LICENSE"
      - "NOTICE.txt"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - "LICENSE"
      - "NOTICE.txt"
      - "CODE_OF_CONDUCT.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (Qt 6.8, Release)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-windows-qt

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: PixelStudio-win64
          path: build-ci/Release/PixelStudio.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS universal (Qt 6.8, Release)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-macos-qt

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x installer/macos-make-icns.sh
          installer/macos-make-icns.sh
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-ci --parallel

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x installer/macos-verify-universal.sh
          installer/macos-verify-universal.sh build-ci/PixelStudio.app

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build-ci/PixelStudio.app PixelStudio-macos.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: PixelStudio-macos
          path: PixelStudio-macos.zip
          if-no-files-found: error
          retention-days: 14
