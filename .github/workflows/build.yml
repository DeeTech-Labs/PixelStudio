name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - "LICENSE"
      - "NOTICE.txt"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - "LICENSE"
      - "NOTICE.txt"
      - "CODE_OF_CONDUCT.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (Qt 6.8, Release)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-windows-qt

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: PixelStudio-win64
          path: build-ci/Release/PixelStudio.exe
          if-no-files-found: error
          retention-days: 14
