name: "❓ Вопрос"
description: Как настроить экспорт, профиль дисплея или workflow
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Для сбоев — шаблон **🐛 Баг**. Здесь только вопросы «как сделать»: экспорт, профили, форматы.

  - type: input
    id: version
    attributes:
      label: Версия PixelStudio
      placeholder: "из «О программе» (About)"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Вопрос
      description: Что вы пытаетесь сделать и где застряли?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Контекст
      placeholder: |
        - Контроллер / дисплей
        - Целевой формат (C array, RGB565, RLE, …)
        - Что уже пробовали
