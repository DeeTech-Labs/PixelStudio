name: "Предложить улучшение"
description: Новая возможность или изменение существующего поведения
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Кратко опишите задачу пользователя. Если есть аналог в других утилитах — укажите для сравнения.

        Текущие планы: [ROADMAP.md](https://github.com/DeeTech-Labs/PixelStudio/blob/main/ROADMAP.md).

  - type: dropdown
    id: display_type
    attributes:
      label: Тип дисплея
      options:
        - OLED (монохром)
        - OLED (цветной)
        - TFT / LCD (RGB)
        - E-paper
        - LED матрица
        - Несколько типов
        - Не применимо
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Контроллер / драйвер
      description: SSD1306, ILI9341, ST7789… — перечислите все релевантные
      placeholder: "ILI9341, ST7789"
    validations:
      required: false

  - type: dropdown
    id: export_format
    attributes:
      label: Формат экспорта
      options:
        - C/C++ header (.h)
        - Бинарный (.bin)
        - Пакетный экспорт
        - Sprite atlas
        - Watch folder
        - Несколько форматов
        - Не применимо
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Задача / боль
      description: Какой сценарий (OLED/TFT, экспорт, UI) вы хотите упростить?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы

  - type: dropdown
    id: priority
    attributes:
      label: Важность для вас
      options:
        - Желательно
        - Важно для моего проекта
        - Блокирует работу
    validations:
      required: true
