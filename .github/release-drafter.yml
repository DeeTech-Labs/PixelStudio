name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver: linear
categories:
  - title: "Features"
    labels: ["enhancement"]
  - title: "Bug fixes"
    labels: ["bug"]
  - title: "Build & CI"
    labels: ["build"]
  - title: "Documentation"
    labels: ["documentation"]
  - title: "Maintenance"
    labels: ["dependencies"]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## Изменения

  $CHANGES

  **Версия:** v$RESOLVED_VERSION

  Установщик Windows публикуется workflow [Release](https://github.com/DeeTech-Labs/PixelStudio/actions/workflows/release.yml) при push тега `v$RESOLVED_VERSION`.

  > Предупреждения «No published release» до первого опубликованного релиза — нормальны: сравнение с предыдущим тегом появится после `v0.1.0`.
