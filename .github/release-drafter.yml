name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
  patch:
    labels:
      - patch
categories:
  - title: "Features"
    labels: ["enhancement"]
  - title: "Bug fixes"
    labels: ["bug"]
  - title: "Build & CI"
    labels: ["build"]
  - title: "Documentation"
    labels: ["documentation"]
  - title: "Maintenance"
    labels: ["dependencies"]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## Изменения

  $CHANGES

  **Версия (черновик):** v$RESOLVED_VERSION — формат `Major.Minor.Patch` (см. [docs/versioning.md](https://github.com/DeeTech-Labs/PixelStudio/blob/main/docs/versioning.md)).

  **Суффикс fix** (`0.1.0b`, `1.2.3b`): Release Drafter не добавляет букву автоматически. Перед публикацией:
  1. Обновите `PS_VERSION_FIX` в `cmake/PixelStudioVersion.cmake`
  2. Переименуйте тег/релиз в `v1.2.3b` (метка PR `version-fix`)

  Установщик: workflow [Release](https://github.com/DeeTech-Labs/PixelStudio/actions/workflows/release.yml) при push тега.
